name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest ships the Android SDK under /usr/local/lib/android/sdk.
          # We used to call android-actions/setup-android@v3, but its bootstrap runs
          # `sdkmanager tools`, and that package was removed from the newer
          # cmdline-tools shipped on the runner image ("Failed to find package 'tools'").
          SDK_ROOT="${ANDROID_SDK_ROOT:-}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$RUNNER_TEMP/android-sdk"
            echo "No preinstalled SDK found; downloading command-line tools into $SDK_ROOT"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools-unpack
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          TOOLS_BIN=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$candidate/sdkmanager" ]; then TOOLS_BIN="$candidate"; break; fi
          done
          if [ -z "$TOOLS_BIN" ]; then
            echo "::error title=No sdkmanager::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "$TOOLS_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # `yes | sdkmanager --licenses` legitimately SIGPIPEs `yes`; keep pipefail off here.
          set +o pipefail
          yes | "$TOOLS_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$TOOLS_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK was produced
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" > /dev/null
          ls -lh "$APK"
          echo "### Debug APK built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepConnect-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
