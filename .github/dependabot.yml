version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
    ignore:
      # The Compose compiler plugin version must match the Kotlin version that AGP 9
      # compiles with (built-in Kotlin). Bump it together with AGP, never on its own.
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
